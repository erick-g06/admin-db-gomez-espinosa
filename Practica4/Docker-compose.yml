services:
  mysql_db:
    build:
      context: .
      dockerfile: DockerFile
    container_name: mysql_practica4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: db_inventario_ventas
    ports:
      - "3307:3306"
    volumes:
      - db_data_practica4:/var/lib/mysql

volumes:
  db_data_practica4: